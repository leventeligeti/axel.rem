[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "axel-rem"
version = "0.1.0"
description = "REM — memory engine: prompt-chill + dream agent"
requires-python = ">=3.11"
dependencies = [
    "axel-shared",
    "sentence-transformers>=2.7",
    "redis>=5.0",
    "psycopg2-binary>=2.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["axel_rem*"]
